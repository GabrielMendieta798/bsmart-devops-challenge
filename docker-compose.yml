name: bsmart-platform

# Shared runtime configuration
x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true

  security_opt:
    - no-new-privileges:true

  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  # Web application
  web:
    <<: *service-defaults

    image: "${WEB_IMAGE:?WEB_IMAGE is required}"
    user: "10001:10000"

    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

    environment:
      APP_ENV: "${APP_ENV:-production}"
      API_UPSTREAM: "http://api:8000"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - frontend

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    cpus: "0.5"
    mem_limit: 512m
    stop_grace_period: 30s

  # Backend API
  api:
    <<: *service-defaults

    image: "${API_IMAGE:?API_IMAGE is required}"
    user: "10002:10000"

    expose:
      - "8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      APP_ENV: "${APP_ENV:-production}"

      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USER: "${DB_USER:?DB_USER is required}"

      DB_PASSWORD_FILE: /run/secrets/db_password
      WORKER_TOKEN_FILE: /run/secrets/worker_api_token

      VIDEO_STORAGE_PATH: /data/videos

    secrets:
      - db_password
      - worker_api_token

    volumes:
      - type: bind
        source: "${VIDEO_STORAGE_PATH:?VIDEO_STORAGE_PATH is required}"
        target: /data/videos
        bind:
          create_host_path: false

    networks:
      - frontend
      - backend

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8000/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    cpus: "1.0"
    mem_limit: 1g
    stop_grace_period: 30s

  # Video processing service
  video-worker:
    <<: *service-defaults

    image: "${VIDEO_IMAGE:?VIDEO_IMAGE is required}"
    user: "10003:10000"

    environment:
      APP_ENV: "${APP_ENV:-production}"

      API_URL: "http://api:8000"
      API_TOKEN_FILE: /run/secrets/worker_api_token
      EXTERNAL_API_KEY_FILE: /run/secrets/external_api_key

      VIDEO_STORAGE_PATH: /data/videos

    secrets:
      - worker_api_token
      - external_api_key

    volumes:
      - type: bind
        source: "${VIDEO_STORAGE_PATH:?VIDEO_STORAGE_PATH is required}"
        target: /data/videos
        bind:
          create_host_path: false

    depends_on:
      api:
        condition: service_healthy

    networks:
      - backend

    healthcheck:
      test:
        - CMD
        - /usr/local/bin/healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    cpus: "2.0"
    mem_limit: 4g
    stop_grace_period: 60s

# Service communication networks
networks:

  frontend:
    driver: bridge

  backend:
    driver: bridge

# Runtime secrets provisioned from AWS Secrets Manager
secrets:

  db_password:
    file: "${SECRET_DIR:?SECRET_DIR is required}/db_password"

  worker_api_token:
    file: "${SECRET_DIR:?SECRET_DIR is required}/worker_api_token"

  external_api_key:
    file: "${SECRET_DIR:?SECRET_DIR is required}/external_api_key"
